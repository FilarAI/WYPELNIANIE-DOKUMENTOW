{% extends "baza.html" %}
{% block tresc %}
<section class="karta">
  <h1>1. Wgraj obiegówkę</h1>
  <p class="opis">Program odczyta z niej inwestora, nazwę i adres inwestycji oraz działkę. W następnym kroku
    wybierzesz potrzebne dokumenty, sprawdzisz dane i wygenerujesz wybrane pliki.</p>

  {% if blad %}<div class="komunikat blad">{{ blad }}</div>{% endif %}

  <form id="formularz-pliku" method="post" action="{{ url_for('wybierz_dokumenty') }}" enctype="multipart/form-data">
    <label class="upuszczanie" id="upuszczanie">
      <input type="file" name="obiegowka" id="plik" accept=".docx" required>
      <span class="ikona">⬆</span>
      <span><b>Przeciągnij tutaj plik obiegówki</b><br>albo kliknij, aby wybrać (.docx)</span>
    </label>
  </form>
</section>

<script>
  const strefa = document.getElementById('upuszczanie');
  const plik = document.getElementById('plik');
  const formularz = document.getElementById('formularz-pliku');
  plik.addEventListener('change', () => plik.files.length && formularz.submit());
  ['dragenter', 'dragover'].forEach(z => strefa.addEventListener(z, e => { e.preventDefault(); strefa.classList.add('aktywna'); }));
  ['dragleave', 'drop'].forEach(z => strefa.addEventListener(z, e => { e.preventDefault(); strefa.classList.remove('aktywna'); }));
  strefa.addEventListener('drop', e => {
    if (e.dataTransfer.files.length) { plik.files = e.dataTransfer.files; formularz.submit(); }
  });
</script>
{% endblock %}
