<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dokumenty FILAR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%238a4b1f'/><text x='16' y='23' font-size='20' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>F</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='styl.css') }}">
</head>
<body>
  <header class="naglowek">
    <div class="marka">
      <span class="logo">F</span>
      <div>
        <strong>Dokumenty FILAR</strong>
        <small>Dokumenty z obiegówki</small>
      </div>
    </div>
    <form method="post" action="{{ url_for('zakoncz') }}">
      <button class="przycisk przycisk-cichy" type="submit" title="Wyłącza program">Zakończ program</button>
    </form>
  </header>
  <main>
    {% block tresc %}{% endblock %}
  </main>
  <footer class="stopka">Program działa tylko na tym komputerze – pliki nie są nigdzie wysyłane.<br>
    <small>Wersja {{ wersja }} · folder programu: {{ folder_programu }}</small></footer>
</body>
</html>
